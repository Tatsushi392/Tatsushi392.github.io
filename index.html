<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apps / アプリ一覧</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <div>
      <h1>アプリ一覧 / Apps</h1>
      <p>サポートとプライバシーポリシー / Support and privacy policies</p>
    </div>
  </header>

  <!-- One <a class="app"> per app. New app: copy a block and its folder. -->
  <a class="app" href="dateprintcamera/">
    <img src="dateprintcamera/icon.png" alt="">
    <span>
      <strong>Date Print Camera</strong>
      <span>写真に日付を焼き込むカメラ / Retro date stamp on photos</span>
    </span>
  </a>
  <a class="app" href="feelweather/">
    <img src="feelweather/icon.png" alt="">
    <span>
      <strong>体感予報</strong>
      <span>気温より、感じる天気。 / Feel Weather: apparent temperature first</span>
    </span>
  </a>
  <a class="app" href="taptalk/">
    <img src="taptalk/icon.png" alt="">
    <span>
      <strong>TapTalk 中国語</strong>
      <span>タップで通じる旅行会話 / Tap-to-talk travel Chinese</span>
    </span>
  </a>
</main>
</body>
</html>
